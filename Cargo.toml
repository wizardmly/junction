[package]
name = "junction"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Junction: Git & Code Navigator, recreating Android Studio's Git tools and code navigation"

[dependencies]
# Syntax highlighting for the file editor: the languages Junction indexes,
# plus common config / build file formats.
gpui-kit = { version = "0.7.1", features = [
    "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-go", "tree-sitter-java", "tree-sitter-kotlin",
    "tree-sitter-rust", "tree-sitter-swift", "tree-sitter-javascript", "tree-sitter-typescript",
    "tree-sitter-python", "tree-sitter-toml", "tree-sitter-yaml", "tree-sitter-markdown",
    "tree-sitter-bash", "tree-sitter-cmake", "tree-sitter-make", "tree-sitter-proto",
] }
anyhow = "1"
chrono = "0.4"
similar = { version = "2", features = ["inline", "unicode"] }
# GitHub / GitLab REST APIs (accounts, pull requests, gists).
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Code indexing: tree-sitter symbol extraction for every indexed language
# (versions match the highlighter's), and LSP types for language servers.
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-dart = "0.2"
tree-sitter-objc = "3"
tree-sitter-vlang = "0.1"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
lsp-types = { version = "0.97", features = ["proposed"] }
# The index caches (project and libraries): compact and quick to load.
bincode = "1.3.3"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2

# gpui embeds DirectX shaders precompiled with the Windows SDK's fxc.exe in
# release builds. The vendored copy compiles the embedded HLSL at startup
# instead, so Windows release builds cross-compile from Linux and macOS.
#
# gpui-component and gpui-base are vendored for IntelliJ placement: dialogs open
# centered without sliding down, and notification balloons stack upward from
# the bottom right with a gap instead of collapsing (look for "Junction:").
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
gpui-component = { path = "vendor/gpui-component" }
gpui-base = { path = "vendor/gpui-base" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader"] }
