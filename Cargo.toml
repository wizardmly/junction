[package]
name = "gitglass"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A desktop Git client that recreates the Android Studio / IntelliJ Git experience"

[dependencies]
# Syntax highlighting for the file editor: the languages GitGlass indexes,
# plus common config / build file formats.
gpui-kit = { version = "0.7.1", features = [
    "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-go", "tree-sitter-java", "tree-sitter-kotlin",
    "tree-sitter-rust", "tree-sitter-swift", "tree-sitter-javascript", "tree-sitter-typescript",
    "tree-sitter-python", "tree-sitter-toml", "tree-sitter-yaml", "tree-sitter-markdown",
    "tree-sitter-bash", "tree-sitter-cmake", "tree-sitter-make", "tree-sitter-proto",
] }
anyhow = "1"
chrono = "0.4"
similar = { version = "2", features = ["inline", "unicode"] }
# GitHub / GitLab REST APIs (accounts, pull requests, gists).
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2

# gpui embeds DirectX shaders precompiled with the Windows SDK's fxc.exe in
# release builds. The vendored copy compiles the embedded HLSL at startup
# instead, so Windows release builds cross-compile from Linux and macOS.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
