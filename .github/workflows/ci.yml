# Checks a branch or pull request before it reaches master (where every push
# is a release): the build has no new warnings and the unit tests pass. The
# Linux binary is kept as an artifact so the change can be tried without
# building it again. Windows gets a `cargo check`, so code only Windows
# compiles (`#[cfg(windows)]`) fails here rather than in the release.
name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (count warnings)
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log
          count=$(grep -c '^warning' build.log || true)
          echo "warnings: $count" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Build::$count warnings"
      - name: Unit tests
        run: |
          set -o pipefail
          git config --global user.name ci
          git config --global user.email ci@example.com
          cargo test --release 2>&1 | tee test.log
          grep -E '^test result' test.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Collect the binary, the logs and the packages for headless UI checks
        if: always()
        run: |
          mkdir -p out/debs
          if [ -f target/release/junction ]; then cp target/release/junction out/ && strip out/junction; fi
          cp build.log test.log out/ 2>/dev/null || true
          cd out/debs
          llvm=$(apt-cache depends mesa-vulkan-drivers | awk '/Depends: libllvm/{print $2}' | head -1)
          apt-get download mesa-vulkan-drivers $llvm xdotool libxdo3 || true
      # A full artifact storage doesn't make the checks fail.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: linux-ci
          path: out
          retention-days: 3

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --release
