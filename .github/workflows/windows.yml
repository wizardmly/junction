# Builds junction.exe on Windows for every push to master and publishes it
# as the "latest" release, so the newest build always has the same link.
name: Windows build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Junction | Out-Null
          Copy-Item target/release/junction.exe dist/Junction/
          Compress-Archive -Path dist/Junction -DestinationPath junction-windows-x64.zip -Force
          (Get-FileHash junction-windows-x64.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii junction-windows-x64.zip.sha256
      - name: Publish the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest junction-windows-x64.zip junction-windows-x64.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Junction (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on Windows. Unzip and run Junction/junction.exe."
